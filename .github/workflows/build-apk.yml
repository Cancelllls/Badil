name: Badil Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="v1.1.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Seed Database
        run: |
          python3 tool/seed_generator.py

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Run Tests
        run: |
          flutter test

      - name: Build Android ARM64 APK
        run: |
          flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk Badil-${{ env.RELEASE_TAG }}-arm64.apk

      - name: Build Universal Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk Badil-${{ env.RELEASE_TAG }}-universal.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            Badil-${{ env.RELEASE_TAG }}-arm64.apk
            Badil-${{ env.RELEASE_TAG }}-universal.apk
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
